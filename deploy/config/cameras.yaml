# NOCTUA camera inventory — the ONLY file you edit to bring sites online.
#
# The nine existing Cabot sites. Locations are the community-mapped points
# (OpenStreetMap snapshot, Nov. 15, 2026) — CONFIRM each against the CPD
# inventory (Chief / FOIA) before mounting anything, and note the Home
# Depot Dr / Going Dr ownership question in the runbook.
#
# For each site: set `enabled: true`, fill `host` (the camera's IP on the
# city VLAN), and put its credentials in .env as CAM01_USER / CAM01_PASS …
# (never write passwords in this file — it is meant to be shareable with
# the Commission). `model` is the NOCTUA replacement unit to mount
# (city-owned LPR camera, e.g. Axis Q1800-LE class), NOT the leased Flock
# unit currently there.

cameras:
